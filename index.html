<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiboutik974 ✨ Devis Veilleuse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-200 via-purple-200 to-yellow-200 min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
        <div class="grid lg:grid-cols-2 gap-8">
            <!-- FORMULAIRE -->
            <div class="bg-white rounded-3xl shadow-2xl p-8">
                <h2 class="text-3xl font-bold text-purple-700 mb-6">Remplis ta veilleuse 🪄</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-lg font-bold mb-2">Écris ici ton prénom</label>
                        <input id="nomClient" type="text" class="w-full border-4 border-pink-300 rounded-2xl px-4 py-3 text-xl" placeholder="Ex: Julie">
                    </div>
                    <div>
                        <label class="block text-lg font-bold mb-2">Écris ton mail ici :)</label>
                        <input id="email" type="email" class="w-full border-4 border-pink-300 rounded-2xl px-4 py-3 text-xl" placeholder="exemple@gmail.com">
                    </div>
                    <div>
                        <label class="block text-lg font-bold mb-2">Combien de veilleuses veux-tu ?</label>
                        <select id="nbVeilleuses" class="w-full border-4 border-pink-300 rounded-2xl px-4 py-3 text-xl" onchange="genererVeilleuses()">
                            <option value="1" selected>1 veilleuse</option>
                            <option value="2">2 veilleuses</option>
                            <option value="3">3 veilleuses</option>
                            <option value="4">4 veilleuses</option>
                            <option value="5">5 veilleuses</option>
                            <option value="6">6 veilleuses</option>
                            <option value="7">7 veilleuses</option>
                            <option value="8">8 veilleuses</option>
                            <option value="9">9 veilleuses</option>
                            <option value="10">10 veilleuses</option>
                        </select>
                    </div>
                    <div id="veilleuses-container" class="space-y-6"></div>
                    <div>
                        <label class="block text-lg font-bold mb-2">Taille des lettres (pour toutes les veilleuses)</label>
                        <select id="taille" class="w-full border-4 border-pink-300 rounded-2xl px-4 py-3 text-xl" onchange="calculerPrix()">
                            <option value="10">10 cm</option>
                            <option value="12" selected>12 cm</option>
                            <option value="15">15 cm</option>
                            <option value="20">20 cm</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-lg font-bold mb-2">Tes idées créatives / envies spéciales 💡</label>
                        <textarea id="idees" rows="3" class="w-full border-4 border-pink-300 rounded-3xl px-4 py-3" placeholder="Laisse un message à néO_Créa..."></textarea>
                    </div>
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="livraison" class="w-6 h-6 accent-pink-500" onchange="calculerPrix()">
                        <label for="livraison" class="text-lg font-bold">Livraison à La Réunion (17 €)</label>
                    </div>
                </div>
            </div>

            <!-- DÉTAIL PRIX -->
            <div class="bg-gradient-to-br from-pink-400 to-purple-500 text-white rounded-3xl shadow-2xl p-8 flex flex-col">
                <h2 class="text-3xl font-bold mb-6 text-center">Détail de ton devis ✨</h2>
                <div class="flex-1 space-y-5">
                    <div class="bg-white/20 backdrop-blur rounded-2xl p-5 space-y-3">
                        <div class="flex justify-between"><span>Prix des lettres seules</span><span id="prixLettres" class="font-bold">0 €</span></div>
                        <div class="flex justify-between"><span>+ LED Premium</span><span class="font-bold">12 €</span></div>
                        <div class="flex justify-between"><span>+ Formes choisies</span><span id="prixFormes" class="font-bold">0 €</span></div>
                        <div class="flex justify-between"><span>+ Lithophanie</span><span id="prixLitho" class="font-bold">0 €</span></div>
                        <div class="flex justify-between border-t pt-3"><span class="font-bold">Total avant offres</span><span id="totalBrut" class="font-bold">0 €</span></div>
                    </div>
                    <div class="bg-white/20 backdrop-blur rounded-2xl p-5">
                        <p class="text-yellow-300 font-bold mb-3">Récapitulatif par veilleuse</p>
                        <div id="recap-veilleuses" class="space-y-3 text-sm"></div>
                    </div>
                    <div class="bg-white/20 backdrop-blur rounded-2xl p-5">
                        <p class="text-yellow-300 font-bold mb-3">🎮 Offres activées (cadeaux en plus !)</p>
                        <div id="offres-list" class="space-y-3"></div>
                    </div>
                    <div class="text-center bg-white/30 rounded-2xl p-6">
                        <p class="text-lg">Total à payer</p>
                        <p id="totalFinal" class="text-5xl font-bold">0 €</p>
                        <p class="text-sm">Acompte 50% : <span id="acompte" class="font-bold">0 €</span></p>
                    </div>
                </div>

                <button onclick="envoyerDevis()" class="mt-8 w-full bg-white text-pink-600 font-bold text-3xl py-8 rounded-3xl hover:scale-110 transition-all shadow-2xl flex items-center justify-center gap-4">
                    ✉️ Envoyer ta demande à néO_Créa
                </button>
            </div>
        </div>
    </div>

    <script>
        // ================== TES CLÉS EMAILJS ==================
        emailjs.init("Zi3s-ZwSciwsRW6t6");           // ← Remplace par ta clé qui commence par Zi...

        const SERVICE_ID = "service_qzrf6nm";        // ← Ton Service ID
        const TEMPLATE_ID = "template_qmu3htp";      // ← Ton Template ID (déjà mis)

        const PRIX_LETTRE = 1.10;
        const PRIX_LED = 12;
        const PRIX_FORME = 1.25;
        const PRIX_LITHO = 0.75;
        const PRIX_LIVRAISON = 17;

        // === Le reste du code (identique à avant) ===
        function genererVeilleuses() { /* ... ton code existant ... */ }
        function calculerPrix() { /* ... ton code existant ... */ }
        function isFeteDesMeresActive() { /* ... ton code ... */ }
        function updateOffresVisuelles() { /* ... ton code ... */ }
        function updateRecap() { /* ... ton code ... */ }

        async function envoyerDevis() {
            const nom = document.getElementById('nomClient').value || "Non renseigné";
            const emailClient = document.getElementById('email').value || "Non renseigné";
            const recap = document.getElementById('recap-veilleuses').innerText || "Aucun récapitulatif";
            const total = document.getElementById('totalFinal').textContent;

            const templateParams = {
                nom_client: nom,
                email_client: emailClient,
                recapitulatif: recap,
                total_payer: total,
                date: new Date().toLocaleString('fr-FR')
            };

            try {
                await emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams);
                alert("✅ Demande envoyée avec succès à néO_Créa !\nMerci 💖");
            } catch (error) {
                alert("❌ Erreur d'envoi.\nTu peux copier le récapitulatif et me l'envoyer directement.");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            genererVeilleuses();
        });
    </script>
</body>
</html>
