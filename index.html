<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiboutik974 ✨ Devis Veilleuse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: linear-gradient(to bottom right, #ec4899, #a855f7); color: white; padding: 30px; border-radius: 24px; max-width: 500px; width: 90%; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-200 via-purple-200 to-yellow-200 min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
        <div class="grid lg:grid-cols-2 gap-8">

            <!-- FORMULAIRE -->
            <div class="bg-white rounded-3xl shadow-2xl p-8">
                <h2 class="text-3xl font-bold text-purple-700 mb-6">Remplis ta veilleuse 🪄</h2>
                <!-- Ton formulaire reste IDENTIQUE -->
                <div class="space-y-6">
                    <!-- ... (tout ton formulaire inchangé) ... -->
                    <div>
                        <label class="block text-lg font-bold mb-2">Écris ici ton prénom</label>
                        <input id="nomClient" type="text" class="w-full border-4 border-pink-300 rounded-2xl px-4 py-3 text-xl" placeholder="Ex: Julie">
                    </div>
                    <div>
                        <label class="block text-lg font-bold mb-2">Écris ton mail ici :)</label>
                        <input id="email" type="email" class="w-full border-4 border-pink-300 rounded-2xl px-4 py-3 text-xl" placeholder="exemple@gmail.com">
                    </div>
                    <!-- ... le reste de ton formulaire ... -->
                    <div id="veilleuses-container" class="space-y-6"></div>
                    <!-- Taille, idées, livraison... -->
                </div>
            </div>

            <!-- PANNEAU DROIT - SEULEMENT OFFRES -->
            <div class="bg-gradient-to-br from-pink-400 to-purple-500 text-white rounded-3xl shadow-2xl p-8 flex flex-col">
                <h2 class="text-3xl font-bold mb-6 text-center">Tes cadeaux débloqués 🎁</h2>
                
                <div class="flex-1">
                    <div id="offres-list" class="space-y-3"></div>
                </div>

                <button onclick="envoyerDevis()" 
                        class="mt-8 w-full bg-white text-pink-600 font-bold text-3xl py-10 rounded-3xl hover:scale-110 transition-all shadow-2xl">
                    📧 Recevoir mes tarifs par mail
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL PRIX -->
    <div id="prixModal" class="modal">
        <div class="modal-content text-center">
            <h2 class="text-3xl font-bold mb-6">Voici ton devis complet ✨</h2>
            <div id="modalContent" class="text-left"></div>
            <button onclick="closeModal()" 
                    class="mt-8 w-full bg-white text-pink-600 font-bold py-6 rounded-3xl text-2xl">
                Fermer
            </button>
        </div>
    </div>

    <script>
        // ... tout ton code existant (genererVeilleuses, calculerPrix, updateOffresVisuelles, updateRecap, etc.) reste IDENTIQUE ...

        async function envoyerDevis() {
            const nom = document.getElementById('nomClient').value || "Non renseigné";
            const emailClient = document.getElementById('email').value || "Non renseigné";
            const taille = document.getElementById('taille').value + " cm";
            const idees = document.getElementById('idees').value.trim() || "Aucune";

            let recapDetail = "";
            const veilleuses = document.querySelectorAll('#veilleuses-container > div');
            
            veilleuses.forEach((veilleuse, index) => {
                const texte = veilleuse.querySelector('.veilleuse-input').value.trim() || '—';
                const theme = veilleuse.querySelector('.theme-input').value.trim() || 'Non renseigné';
                const nb = texte.replace(/[_'\-.;,:!?]/g, '').length;
                recapDetail += `Veilleuse #${index + 1} : ${texte} (${nb} caractères)\n`;
                recapDetail += `Thème : ${theme}\n`;
                const formes = Array.from(veilleuse.querySelectorAll('.formes-container button'))
                    .filter(btn => btn.classList.contains('bg-pink-200'))
                    .map(btn => btn.textContent).join(', ') || 'Aucune';
                recapDetail += `Formes : ${formes}\n`;
                const lithoDesc = veilleuse.querySelector('.litho-desc') ? veilleuse.querySelector('.litho-desc').value.trim() : '';
                const lithoCount = veilleuse.querySelector('.litho-count') ? veilleuse.querySelector('.litho-count').value : '0';
                recapDetail += `Gravure : ${lithoDesc || 'Aucune'} (${lithoCount})\n\n`;
            });

            // Envoi du mail
            const templateParams = {
                nom_client: nom,
                email_client: emailClient,
                taille_lettres: taille,
                idees_client: idees,
                recapitulatif: recapDetail,
                prix_lettres: document.getElementById('prixLettres').textContent,
                prix_formes: document.getElementById('prixFormes').textContent,
                prix_litho: document.getElementById('prixLitho').textContent,
                total_avant_offres: document.getElementById('totalBrut').textContent,
                total_payer: document.getElementById('totalFinal').textContent,
                acompte: document.getElementById('acompte').textContent,
                date: new Date().toLocaleString('fr-FR')
            };

            await emailjs.send("service_qzrf6nm", "template_qmu3htp", templateParams);

            // Affichage du modal avec les prix
            const modalContent = `
                <div class="space-y-4 text-lg">
                    <p><strong>Prix des lettres :</strong> ${document.getElementById('prixLettres').textContent}</p>
                    <p><strong>LED Premium :</strong> 12 €</p>
                    <p><strong>Formes :</strong> ${document.getElementById('prixFormes').textContent}</p>
                    <p><strong>Lithophanie :</strong> ${document.getElementById('prixLitho').textContent}</p>
                    <p><strong>Total avant offres :</strong> ${document.getElementById('totalBrut').textContent}</p>
                    <hr>
                    <p class="text-3xl font-bold">Total à payer : ${document.getElementById('totalFinal').textContent}</p>
                    <p>Acompte 50% : ${document.getElementById('acompte').textContent}</p>
                </div>
            `;
            document.getElementById('modalContent').innerHTML = modalContent;
            document.getElementById('prixModal').style.display = 'flex';

            alert("✅ Mail envoyé ! Regarde la fenêtre pour voir tes tarifs.");
        }

        function closeModal() {
            document.getElementById('prixModal').style.display = 'none';
        }

        // Le reste de tes fonctions (calculerPrix, updateRecap, etc.) reste inchangé
        document.addEventListener('DOMContentLoaded', () => {
            genererVeilleuses();
        });
    </script>
</body>
</html>
