<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiboutik974 ✨ Devis Veilleuse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; }
        #recap-veilleuses div {
            background: rgba(255, 255, 255, 0.3);
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 10px;
            border: 2px solid white;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-200 via-purple-200 to-yellow-200 min-h-screen p-4">
    <div class="max-w-5xl mx-auto">
        <div class="grid lg:grid-cols-2 gap-8">
            
            <div class="bg-white rounded-3xl shadow-2xl p-8">
                <h2 class="text-3xl font-bold text-purple-700 mb-6">Remplis ta veilleuse 🪄</h2>
                <div class="space-y-4">
                    <input id="nomClient" type="text" class="w-full border-2 border-pink-200 rounded-xl px-4 py-3" placeholder="Ton prénom">
                    <input id="email" type="email" class="w-full border-2 border-pink-200 rounded-xl px-4 py-3" placeholder="Ton mail">
                    
                    <label class="block font-bold">Nombre de veilleuses</label>
                    <select id="nbVeilleuses" class="w-full border-2 border-pink-200 rounded-xl px-4 py-3" onchange="genererVeilleuses()">
                        <option value="1">1 veilleuse</option>
                        <option value="2">2 veilleuses</option>
                        <option value="3">3 veilleuses</option>
                    </select>

                    <div id="veilleuses-container" class="space-y-4"></div>

                    <label class="block font-bold">Taille</label>
                    <select id="taille" class="w-full border-2 border-pink-200 rounded-xl px-4 py-3" onchange="calculerPrix()">
                        <option value="10">10 cm</option>
                        <option value="12" selected>12 cm</option>
                    </select>

                    <textarea id="idees" class="w-full border-2 border-pink-200 rounded-xl px-4 py-3" placeholder="Tes idées..."></textarea>
                    
                    <label class="flex items-center gap-2 font-bold">
                        <input type="checkbox" id="livraison" onchange="calculerPrix()"> Livraison Réunion (17€)
                    </label>

                    <button id="btn-envoi" onclick="envoyerDevis()" class="w-full bg-purple-600 text-white font-bold text-xl py-5 rounded-2xl shadow-lg hover:bg-purple-700 transition-all mt-4">
                        ✉️ Recevoir les tarifs par mail
                    </button>
                </div>
            </div>

            <div id="panneau-prix" style="display: none;" class="bg-gradient-to-br from-pink-400 to-purple-500 text-white rounded-3xl shadow-2xl p-8 flex flex-col">
                <h2 class="text-3xl font-bold mb-6 text-center">Ton Devis ✨</h2>
                <div class="space-y-4">
                    <div class="bg-white/20 p-4 rounded-xl">
                        <div class="flex justify-between"><span>Lettres</span><span id="prixLettres">0 €</span></div>
                        <div class="flex justify-between"><span>Formes/Litho</span><span id="prixOptions">0 €</span></div>
                        <div class="flex justify-between font-bold border-t mt-2 pt-2"><span>Total</span><span id="totalFinal">0 €</span></div>
                    </div>
                    <div id="recap-veilleuses" class="text-sm"></div>
                    <div class="text-center bg-white/30 p-4 rounded-xl">
                        <p class="text-lg">Acompte 50%</p>
                        <p id="acompte" class="text-3xl font-bold">0 €</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        emailjs.init("Zi3s-ZwSciwsRW6t6");
        
        function genererVeilleuses() {
            const nb = document.getElementById('nbVeilleuses').value;
            const container = document.getElementById('veilleuses-container');
            container.innerHTML = '';
            for (let i = 1; i <= nb; i++) {
                const div = document.createElement('div');
                div.className = 'p-4 border-2 border-pink-100 rounded-2xl bg-pink-50';
                div.innerHTML = `
                    <input type="text" class="veilleuse-input w-full border-2 border-white rounded-lg px-3 py-2 mb-2" placeholder="Prénom veilleuse #${i}" oninput="calculerPrix()">
                    <div class="grid grid-cols-3 gap-1">
                        ${["Stitch", "Cœur", "974", "Luffy", "Manette", "Pikachu"].map(f => `<button onclick="this.classList.toggle('bg-pink-300'); calculerPrix();" class="forme-btn bg-white text-[10px] p-1 rounded border">${f}</button>`).join('')}
                    </div>
                `;
                container.appendChild(div);
            }
            calculerPrix();
        }

        function calculerPrix() {
            const taille = parseFloat(document.getElementById('taille').value);
            const livraison = document.getElementById('livraison').checked;
            const inputs = document.querySelectorAll('.veilleuse-input');
            let totalLettres = 0;
            let totalOptions = 0;

            inputs.forEach(input => {
                const txt = input.value.trim().replace(/[^a-zA-Z]/g, '');
                totalLettres += txt.length;
                const formes = input.parentElement.querySelectorAll('.bg-pink-300').length;
                totalOptions += (formes * taille * 1.15);
            });

            const pLettres = totalLettres * taille * 1;
            const total = pLettres + (inputs.length * 12) + totalOptions + (livraison ? 17 : 0);

            document.getElementById('prixLettres').innerText = pLettres.toFixed(2) + " €";
            document.getElementById('prixOptions').innerText = totalOptions.toFixed(2) + " €";
            document.getElementById('totalFinal').innerText = total.toFixed(2) + " €";
            document.getElementById('acompte').innerText = (total / 2).toFixed(2) + " €";
            
            const recap = document.getElementById('recap-veilleuses');
            recap.innerHTML = '';
            inputs.forEach((inp, i) => {
                const d = document.createElement('div');
                d.innerHTML = `<b>#${i+1}</b>: ${inp.value || '...'}`;
                recap.appendChild(d);
            });
        }

        async function envoyerDevis() {
            const nom = document.getElementById('nomClient').value;
            const mail = document.getElementById('email').value;

            if (!nom || !mail) { return; } // Pas de popup, on attend juste la saisie

            const btn = document.getElementById('btn-envoi');
            btn.innerText = "⏳ Envoi...";
            btn.disabled = true;

            const params = {
                nom_client: nom,
                email_client: mail,
                total_payer: document.getElementById('totalFinal').innerText,
                acompte: document.getElementById('acompte').innerText,
                recapitulatif: document.getElementById('recap-veilleuses').innerText,
                date: new Date().toLocaleString()
            };

            try {
                await emailjs.send("service_qzrf6nm", "template_qmu3htp", params);
                await emailjs.send("service_qzrf6nm", "template_ag95plm", params);
                
                document.getElementById('panneau-prix').style.display = 'block';
                btn.innerText = "✅ Envoyé !";
                btn.style.background = "#10b981";
            } catch (e) {
                document.getElementById('panneau-prix').style.display = 'block';
                btn.innerText = "✉️ Réessayer";
                btn.disabled = false;
            }
        }

        window.onload = genererVeilleuses;
    </script>
</body>
</html>
